name: UVFC demo checks
on:
  push:
    branches: [feat/demo-uniao-verde-azul]
  pull_request:
    paths: ['demo/uniao-verde-azul/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pages
        run: node tests/check.mjs
        working-directory: demo/uniao-verde-azul
