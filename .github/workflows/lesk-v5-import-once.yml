name: "LESK V5 asset import - one time"
on:
  push:
    branches:
      - "feat/topo-lesk-v5-original"
    paths:
      - ".github/workflows/lesk-v5-import-once.yml"
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original artwork at full resolution
        env:
          THUMB_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:49/quality:100/uri:ifs%3A%2F%2FM%2F8c96dd6e-7bc2-4812-9a4b-5e6a495ba163/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJN-doOBBQPwIQBwk1yYxlNseN7E8t9a29zRJhe_v8f5&exp=1792288752&osig=AAAAAAAAAAAAAAAAAAAAANO6YjJ0YGoYKnvIzNWhBIcWoVgT6sJfqN-B4pkY5P0L&signer=media-rpc&token=AAIAAU0AJDhjOTZkZDZlLTdiYzItNDgxMi05YTRiLTVlNmE0OTViYTE2MwAAAAABoUy8AYBb1lnRXB24JkOVIRAGQ7cUItCuBPGHflstvxaR1NxyOQ&x-canva-quality=thumbnail"
        run: |
          python3 -m pip install --quiet pillow requests
          python3 - <<'PY'
          import os
          import requests
          from io import BytesIO
          from PIL import Image
          from pathlib import Path
          thumb=os.environ['THUMB_URL']
          candidates=[
             thumb.replace('/height:49/','/height:328/').replace('/width:200?','/width:1324?').replace('&x-canva-quality=thumbnail',''),
             thumb.replace('/height:49/','/height:328/').replace('/width:200?','/width:1324?'),
             thumb.replace('/height:49/','/height:328/').replace('/width:200?','/width:1324?').split('?')[0],
          ]
          img=None
          for n,u in enumerate(candidates,1):
              try:
                  r=requests.get(u,timeout=20)
                  print(f'candidate {n}: code {r.status_code} length {len(r.content)}')
                  if r.ok:
                      test=Image.open(BytesIO(r.content))
                      print('size:',test.size)
                      if test.width>=1324 and test.height>=328:
                          img=test.convert('RGB')
                          break
              except Exception as e:
                  print('request error:',str(e)[:300])
          if img is None:
              raise RuntimeError('Canva full-size source is not accessible through thumbnail URL; do not publish low-resolution approximation')
          out=Path('assets/images')
          out.mkdir(parents=True,exist_ok=True)
          img.crop((0,55,1324,328)).save(out/'lesk-v5-desktop.webp',format='WEBP',quality=73,method=6)
          img.crop((668,55,1036,328)).save(out/'lesk-v5-mobile.webp',format='WEBP',quality=73,method=6)
          PY
      - name: Commit permanent assets and remove temporary workflow
        run: |
          rm -f .github/workflows/lesk-v5-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/lesk-v5-desktop.webp assets/images/lesk-v5-mobile.webp .github/workflows/lesk-v5-import-once.yml
          git commit -m "assets(site): store V5 original concept 1 artwork locally"
          git push origin HEAD:feat/topo-lesk-v5-original
